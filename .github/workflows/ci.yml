name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform_ci_only
          POSTGRES_DB: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://platform:platform_ci_only@localhost:5432/platform?schema=public
      TEST_DATABASE_URL: postgresql://platform:platform_ci_only@localhost:5432/platform?schema=test
      REQUIRE_DB_TESTS: "1"
      NEXTAUTH_SECRET: ci-only-not-a-secret
      NEXTAUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Migrations apply cleanly
        run: npx prisma migrate deploy
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (incl. apps may not import @prisma/client / platform/db)
        run: npm run lint
      - name: check-actions (every server export is defineAction, every route/page guarded)
        run: npm run check:actions
      - name: check-schema (@pii / @money annotations)
        run: npm run check:schema
      - name: Tests (unit + DB integration + guardrail fixtures)
        run: npm test
      - name: npm audit --audit-level=high (with expiring allowlist)
        run: npm run check:audit
      - name: Build
        run: npm run build
